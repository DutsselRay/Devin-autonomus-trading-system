[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aoic-kernel"
version = "0.1.0"
description = "Autonomous Opportunity Intelligence Company — Company Kernel"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "jsonschema>=4.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["company-kernel/aoic_kernel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["company-kernel"]
